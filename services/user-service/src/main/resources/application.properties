spring.application.name=user-service

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

management.endpoints.web.exposure.include=health,info

# JWT Configuration
# Secret key: Minimum 256 bits (32 bytes) for HS256 algorithm
jwt.secret-key=${JWT_SECRET_KEY}
# JWT expiration: 1 hour in milliseconds
jwt.expiration-ms=3600000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:172.25.36.102:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[spring.json.add.type.headers]=false
app.kafka.topics.user-events=user.events